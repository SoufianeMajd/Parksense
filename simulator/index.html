<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulateur ESP32 ParkSense</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    h1 { font-size: 1.6rem; margin-bottom: 0.25rem; color: #f8fafc; }
    .subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .card {
      background: #1e293b;
      padding: 1.5rem;
      border-radius: 16px;
      border: 1px solid #334155;
      width: 100%;
      max-width: 560px;
      margin-bottom: 1.5rem;
    }

    /* Connection status */
    .conn-status {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.6rem 1rem; border-radius: 10px;
      font-weight: 600; font-size: 0.85rem; margin-bottom: 1.25rem;
    }
    .conn-status.disconnected { background: #3b1114; color: #f87171; }
    .conn-status.connected    { background: #052e16; color: #4ade80; }
    .conn-status .dot { width: 8px; height: 8px; border-radius: 50%; }
    .conn-status.disconnected .dot { background: #f87171; }
    .conn-status.connected .dot    { background: #4ade80; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* Summary */
    .summary {
      display: flex; justify-content: space-around;
      padding: 0.8rem; background: #0f172a;
      border-radius: 10px; border: 1px solid #334155;
      margin-bottom: 1.25rem;
    }
    .summary-item { text-align: center; }
    .summary-val { font-size: 1.3rem; font-weight: 800; }
    .summary-val.green { color: #4ade80; }
    .summary-val.red   { color: #f87171; }
    .summary-val.blue  { color: #60a5fa; }
    .summary-lbl { font-size: 0.7rem; color: #64748b; margin-top: 2px; }

    /* Spots grid — 3 columns for 6 spots */
    .spots-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .spot-card {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 0.8rem 0.5rem;
      text-align: center;
      transition: border-color 0.3s;
    }
    .spot-card.free     { border-color: #22c55e; }
    .spot-card.occupied { border-color: #ef4444; }

    .spot-topic { font-size: 0.65rem; color: #475569; margin-bottom: 0.3rem; word-break: break-all; }
    .spot-id { font-size: 1.3rem; font-weight: 800; margin-bottom: 0.3rem; }
    .spot-card.free .spot-id     { color: #4ade80; }
    .spot-card.occupied .spot-id { color: #f87171; }

    .spot-badge {
      display: inline-block; padding: 0.15rem 0.5rem;
      border-radius: 20px; font-size: 0.7rem;
      font-weight: 700; letter-spacing: 0.5px; margin-bottom: 0.6rem;
    }
    .spot-card.free .spot-badge     { background: #052e16; color: #4ade80; }
    .spot-card.occupied .spot-badge { background: #3b1114; color: #f87171; }

    .spot-btns { display: flex; gap: 0.4rem; }
    .spot-btns button {
      flex: 1; padding: 0.4rem; border: none; border-radius: 6px;
      font-size: 0.72rem; font-weight: 700; cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .spot-btns button:active { transform: scale(0.96); }
    .spot-btns button:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-free { background: #22c55e; color: #fff; }
    .btn-occ  { background: #ef4444; color: #fff; }

    .spot-card.fixed { border-color: #7f1d1d; opacity: 0.6; }
    .spot-card.fixed .spot-id { color: #f87171; }

    /* Log */
    .log-container {
      margin-top: 0.75rem; background: #0f172a;
      border: 1px solid #334155; border-radius: 10px;
      padding: 0.75rem; max-height: 140px; overflow-y: auto;
      font-size: 0.75rem; color: #64748b;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
    }
    .log-container div { padding: 2px 0; }
    .log-container .msg-sent { color: #4ade80; }
    .log-container .msg-recv { color: #60a5fa; }
    .log-container .msg-err  { color: #f87171; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>

  <h1>🅿️ Simulateur ESP32 ParkSense</h1>
  <p class="subtitle">6 places — 4 contrôlables en temps réel via MQTT</p>

  <div class="card">
    <div id="conn-status" class="conn-status disconnected">
      <span class="dot"></span> Déconnecté
    </div>

    <div class="summary">
      <div class="summary-item">
        <div class="summary-val green" id="free-count">4</div>
        <div class="summary-lbl">Libres</div>
      </div>
      <div class="summary-item">
        <div class="summary-val red" id="occ-count">2</div>
        <div class="summary-lbl">Occupées</div>
      </div>
      <div class="summary-item">
        <div class="summary-val blue">6</div>
        <div class="summary-lbl">Total</div>
      </div>
    </div>

    <div class="spots-grid">
      <!-- A1 -->
      <div class="spot-card free" id="card-A1">
        <div class="spot-topic">parkwize/place1</div>
        <div class="spot-id">A1</div>
        <div class="spot-badge">LIBRE</div>
        <div class="spot-btns">
          <button class="btn-free" disabled onclick="publish('A1','Libre')">Libérer</button>
          <button class="btn-occ" disabled onclick="publish('A1','Occupee')">Occuper</button>
        </div>
      </div>
      <!-- A2 -->
      <div class="spot-card free" id="card-A2">
        <div class="spot-topic">parkwize/place2</div>
        <div class="spot-id">A2</div>
        <div class="spot-badge">LIBRE</div>
        <div class="spot-btns">
          <button class="btn-free" disabled onclick="publish('A2','Libre')">Libérer</button>
          <button class="btn-occ" disabled onclick="publish('A2','Occupee')">Occuper</button>
        </div>
      </div>
      <!-- A3 -->
      <div class="spot-card free" id="card-A3">
        <div class="spot-topic">parkwize/place3</div>
        <div class="spot-id">A3</div>
        <div class="spot-badge">LIBRE</div>
        <div class="spot-btns">
          <button class="btn-free" disabled onclick="publish('A3','Libre')">Libérer</button>
          <button class="btn-occ" disabled onclick="publish('A3','Occupee')">Occuper</button>
        </div>
      </div>
      <!-- A4 -->
      <div class="spot-card free" id="card-A4">
        <div class="spot-topic">parkwize/place4</div>
        <div class="spot-id">A4</div>
        <div class="spot-badge">LIBRE</div>
        <div class="spot-btns">
          <button class="btn-free" disabled onclick="publish('A4','Libre')">Libérer</button>
          <button class="btn-occ" disabled onclick="publish('A4','Occupee')">Occuper</button>
        </div>
      </div>
      <!-- A5 — fixed occupied -->
      <div class="spot-card occupied fixed" id="card-A5">
        <div class="spot-topic">—</div>
        <div class="spot-id">A5</div>
        <div class="spot-badge">OCCUPÉE</div>
        <div class="spot-btns">
          <button class="btn-free" disabled style="opacity:0.2">—</button>
          <button class="btn-occ" disabled style="opacity:0.2">—</button>
        </div>
      </div>
      <!-- A6 — fixed occupied -->
      <div class="spot-card occupied fixed" id="card-A6">
        <div class="spot-topic">—</div>
        <div class="spot-id">A6</div>
        <div class="spot-badge">OCCUPÉE</div>
        <div class="spot-btns">
          <button class="btn-free" disabled style="opacity:0.2">—</button>
          <button class="btn-occ" disabled style="opacity:0.2">—</button>
        </div>
      </div>
    </div>

    <div class="log-container" id="log">
      <div>[Système] Prêt à se connecter...</div>
    </div>
  </div>

<script>
  const broker = "broker.hivemq.com";
  const port   = 8000;

  const SPOTS = {
    A1: { topic: 'parkwize/place1', status: 'Libre' },
    A2: { topic: 'parkwize/place2', status: 'Libre' },
    A3: { topic: 'parkwize/place3', status: 'Libre' },
    A4: { topic: 'parkwize/place4', status: 'Libre' },
  };
  // A5, A6 are always occupied (no MQTT topic)

  const clientId = "Simulateur_" + Math.random().toString(16).substr(2, 8);
  const client   = new Paho.MQTT.Client(broker, port, "/mqtt", clientId);

  const logEl  = document.getElementById("log");
  const connEl = document.getElementById("conn-status");
  const freeEl = document.getElementById("free-count");
  const occEl  = document.getElementById("occ-count");

  function addLog(msg, cls) {
    const div  = document.createElement('div');
    const time = new Date().toLocaleTimeString();
    div.innerText = `[${time}] ${msg}`;
    if (cls) div.className = cls;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function refreshUI() {
    let freeCount = 0;
    for (const [id, spot] of Object.entries(SPOTS)) {
      const card  = document.getElementById('card-' + id);
      const badge = card.querySelector('.spot-badge');
      const isFree = spot.status === 'Libre';
      card.className = 'spot-card ' + (isFree ? 'free' : 'occupied');
      badge.textContent = isFree ? 'LIBRE' : 'OCCUPÉE';
      if (isFree) freeCount++;
    }
    freeEl.textContent = freeCount;
    occEl.textContent  = 6 - freeCount; // includes fixed A5+A6
  }

  function setButtonsEnabled(enabled) {
    document.querySelectorAll('.spot-card:not(.fixed) .spot-btns button').forEach(b => b.disabled = !enabled);
  }

  client.onConnectionLost = function(resp) {
    connEl.className = "conn-status disconnected";
    connEl.innerHTML = '<span class="dot"></span> Déconnecté';
    setButtonsEnabled(false);
    if (resp.errorCode !== 0) addLog("Connexion perdue : " + resp.errorMessage, 'msg-err');
  };

  client.onMessageArrived = function(message) {
    const payload = message.payloadString.trim();
    const topic   = message.destinationName;
    for (const [id, spot] of Object.entries(SPOTS)) {
      if (spot.topic === topic && (payload === 'Libre' || payload === 'Occupee')) {
        spot.status = payload;
        refreshUI();
        addLog(`${id} ← ${payload}`, 'msg-recv');
        return;
      }
    }
  };

  addLog("Connexion à " + broker + "...");

  client.connect({
    onSuccess: function() {
      connEl.className = "conn-status connected";
      connEl.innerHTML = '<span class="dot"></span> Connecté au broker MQTT';
      setButtonsEnabled(true);
      addLog("Connecté !");
      Object.values(SPOTS).forEach(s => client.subscribe(s.topic));

      // Publier l'état "Libre" par défaut pour les 4 places au démarrage
      setTimeout(() => {
        addLog("Initialisation des places à 'Libre'...");
        Object.keys(SPOTS).forEach(spotId => {
          publish(spotId, 'Libre');
        });
      }, 500);
    },
    onFailure: function(err) {
      addLog("Échec : " + err.errorMessage, 'msg-err');
    },
    useSSL: false,
    timeout: 3
  });

  function publish(spotId, state) {
    const spot = SPOTS[spotId];
    if (!spot || !client.isConnected()) {
      addLog("Erreur : Non connecté.", 'msg-err');
      return;
    }
    const msg = new Paho.MQTT.Message(state);
    msg.destinationName = spot.topic;
    msg.retained = true; // Le broker conserve cet état pour les nouveaux clients
    client.send(msg);
    addLog(`${spotId} → ${state}`, 'msg-sent');
  }
</script>
</body>
</html>
