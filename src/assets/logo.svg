<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <!-- Definitions for glowing effects -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .cyan-line { 
        stroke: #00D4FF; 
        stroke-width: 5; 
        stroke-linecap: round; 
        stroke-linejoin: round; 
        fill: none; 
        filter: url(#glow);
      }
      .green-line { 
        stroke: #39FF14; 
        stroke-width: 3.5; 
        stroke-linecap: round; 
        stroke-linejoin: round; 
        fill: none; 
        filter: url(#glow);
      }
      .green-dot { 
        fill: #39FF14; 
        filter: url(#glow);
      }
      .text-park { 
        fill: #00D4FF; 
        font-family: 'Segoe UI', 'Montserrat', sans-serif; 
        font-size: 20px; 
        font-weight: 800; 
        letter-spacing: 1px; 
      }
      .text-sense { 
        fill: #39FF14; 
        font-family: 'Segoe UI', 'Montserrat', sans-serif; 
        font-size: 20px; 
        font-weight: 800; 
        letter-spacing: 1px; 
      }
    </style>
  </defs>

  <!-- Central Map Pin -->
  <path class="cyan-line" d="M100,105 C100,105 87,85 87,70 A13,13 0 1,1 113,70 C113,85 100,105 100,105 Z" />
  <!-- Inner Map Pin Dot -->
  <circle class="green-line" cx="100" cy="70" r="3" />

  <!-- Inner Orbit (Starts from bottom of pin, goes left, over the top) -->
  <path class="cyan-line" d="M96,105 C85,100 76,90 76,75 A24,24 0 0,1 118,58" />
  
  <!-- Top Green Dot (End of inner orbit) -->
  <circle class="green-dot" cx="125" cy="55" r="4.5" />

  <!-- Outer Orbit Segment 1 (The main P stem and top arch) -->
  <!-- U-turn hook at bottom left to straight leg up -->
  <path class="cyan-line" d="M80,140 A7.5,7.5 0 0,1 65,140 L65,75 A35,35 0 0,1 123,45" />

  <!-- Outer Orbit Segment 2 (Right side gap filler) -->
  <path class="cyan-line" d="M132,55 A35,35 0 0,1 135,70" />

  <!-- Bottom Green Dot (On outer orbit) -->
  <circle class="green-dot" cx="134" cy="80" r="4.5" />

  <!-- Outer Orbit Segment 3 (Under wrap returning to inner stem) -->
  <path class="cyan-line" d="M128,92 C120,110 105,115 95,115 C85,115 80,122 80,130 L80,140" />

  <!-- Text Logo -->
  <text x="18" y="180">
    <tspan class="text-park">PARK</tspan><tspan class="text-sense">SENSE</tspan>
  </text>
</svg>
